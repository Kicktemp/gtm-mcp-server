# Kicktemp fork: build, test and vulnerability check only.
# The upstream release/deploy workflow (SSH deploy to the author's server) and
# the third-party scanners were removed on purpose; nothing here uses secrets.
name: CI

on:
  push:
    branches: [kicktemp/main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest 1.26.x patch release: govulncheck flags standard-library
          # fixes that older patch releases do not have.
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
